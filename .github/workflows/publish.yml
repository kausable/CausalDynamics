name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.10"

    - name: Check that the tag matches the package version
      run: |
        version=$(uv version --short)
        if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
          echo "Tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"
          exit 1
        fi

    - name: Build sdist and wheel
      run: uv build

    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI must list this repository, workflow (publish.yml)
    # and environment (pypi) as a trusted publisher for the causaldynamics project.
    environment:
      name: pypi
      url: https://pypi.org/project/causaldynamics/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
